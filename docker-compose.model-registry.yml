# Model Registry Service Docker Compose
# Adds the Model Registry service to the SmartDockAI platform

version: '3.8'

services:
  # Model Registry Service
  model-registry:
    build:
      context: ./model-registry-service
      dockerfile: Dockerfile
    container_name: smartdock-model-registry
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/smartdock_registry
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET_NAME=model-artifacts
      - MLFLOW_TRACKING_URI=http://localhost:5000
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - minio
      - mlflow
    volumes:
      - model_registry_logs:/app/logs
    networks:
      - smartdock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MLflow Tracking Server
  mlflow:
    image: python:3.11-slim
    container_name: smartdock-mlflow
    ports:
      - "5000:5000"
    command: >
      bash -c "
        pip install mlflow[extras]==2.8.1 psycopg2-binary boto3 &&
        mlflow server 
        --backend-store-uri postgresql://postgres:password@postgres:5432/mlflow_db
        --default-artifact-root s3://mlflow-artifacts/
        --artifacts-destination s3://mlflow-artifacts/
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
      "
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin123
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      - postgres
      - minio
    networks:
      - smartdock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: smartdock-minio
    ports:
      - "9000:9000"
      - "9001:9001"  # MinIO Console
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - smartdock-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MinIO Bucket Creation (runs once to create required buckets)
  minio-setup:
    image: minio/mc:latest
    container_name: smartdock-minio-setup
    depends_on:
      - minio
    networks:
      - smartdock-network
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/model-artifacts --ignore-existing;
      /usr/bin/mc mb myminio/mlflow-artifacts --ignore-existing;
      /usr/bin/mc policy set public myminio/model-artifacts;
      /usr/bin/mc policy set public myminio/mlflow-artifacts;
      echo 'MinIO buckets created successfully';
      "

volumes:
  model_registry_logs:
    driver: local
  minio_data:
    driver: local

networks:
  smartdock-network:
    external: true