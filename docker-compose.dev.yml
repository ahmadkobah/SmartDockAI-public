version: '3.8'

services:
  app:
    build:
      context: .
      target: development
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./tests:/app/tests
      - /app/node_modules  # Prevent overwriting node_modules
    environment:
      NODE_ENV: development
    command: npm run dev
    stdin_open: true
    tty: true